<?xml version="1.0" encoding="UTF-8"?>
<!--
  Frejya — Open Graph image (1200 × 630)
  Logo üstte, FREJYA wordmark ile arası fazla, alt tagline ile arası eşit.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FCFBF8" />
      <stop offset="100%" stop-color="#FFF6E4" />
    </linearGradient>
  </defs>

  <!-- ZEMİN -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!--
    ANAHTAR — viewBox 24×24, scale 3 → 72×72 px görsel.
    translate (564, 90): logo üst-merkezde, çevresinde bol boşluk.
    Logo y aralığı: 90 + 4*3 = 102 .. 90 + 21*3 = 153 (yaklaşık 51px yüksek)
  -->
  <g transform="translate(564, 90) scale(3)" fill="none" stroke="#C0A080"
     stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M5 21 8 10" />
    <path d="M8 12 12 16" />
    <polygon points="5,4 11,4 8,8" fill="#C0A080" stroke="none" />
    <path d="M19 21 16 10" />
    <path d="M16 12 12 16" />
    <polygon points="19,4 13,4 16,8" fill="#C0A080" stroke="none" />
    <polygon points="12,15 13,16 12,17 11,16" fill="#C0A080" stroke="none" />
  </g>

  <!--
    FREJYA wordmark
    baseline y=350 (önce 370'tı, 20px daha aşağı).
    font-size 88 → glyph üst ~270.
    Logo alt 153 ile FREJYA glyph top 270 arasında ~117 px boşluk. TEMİZ.
  -->
  <text x="600" y="350"
        font-family="'Playfair Display', Georgia, serif"
        font-size="88" font-weight="400" letter-spacing="8"
        fill="#C0A080" text-anchor="middle">
    FREJYA
  </text>

  <!--
    TAGLINE
    baseline y=480, font-size 32. Bir sonraki öğe yok, alt 480.
    FREJYA glyph bottom ~358 ile tagline top ~458 → ~100px boşluk.
  -->
  <text x="600" y="480"
        font-family="'Fraunces', Georgia, serif"
        font-size="32" font-weight="500"
        fill="#2D2B2A" text-anchor="middle">
    Derin bağlar. Doğru aşklar.
  </text>
</svg>
