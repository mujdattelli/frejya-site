<?xml version="1.0" encoding="UTF-8"?>
<!--
  Frejya — Open Graph / Twitter Card image (1200 × 630)
  Sade hâl: tek anahtar üstte, FREJYA wordmark ortada, tek tagline altta.
  Bolca whitespace. Hero gradient'ı + ince altın çerçeve.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FCFBF8" />
      <stop offset="100%" stop-color="#FFF6E4" />
    </linearGradient>
  </defs>

  <!-- ZEMİN -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- ANAHTAR (tek, ortalanmış, küçük) -->
  <!-- viewBox 24×24, scale 3.5 → 84×84 px. Y merkezi ~180. -->
  <g transform="translate(558, 138) scale(3.5)" fill="none" stroke="#C0A080"
     stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M5 21 8 10" />
    <path d="M8 12 12 16" />
    <polygon points="5,4 11,4 8,8" fill="#C0A080" stroke="none" />
    <path d="M19 21 16 10" />
    <path d="M16 12 12 16" />
    <polygon points="19,4 13,4 16,8" fill="#C0A080" stroke="none" />
    <polygon points="12,15 13,16 12,17 11,16" fill="#C0A080" stroke="none" />
  </g>

  <!-- FREJYA wordmark (Playfair Display 400 — mobil ile aynı) -->
  <text x="600" y="380"
        font-family="'Playfair Display', Georgia, serif"
        font-size="92" font-weight="400" letter-spacing="8"
        fill="#C0A080" text-anchor="middle">
    FREJYA
  </text>

  <!-- Tek tagline — sade -->
  <text x="600" y="470"
        font-family="'Fraunces', Georgia, serif"
        font-size="34" font-weight="500" letter-spacing="0"
        fill="#2D2B2A" text-anchor="middle">
    Derin bağlar. Doğru aşklar.
  </text>
</svg>
